name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      # Which algorithms this backend can perform is a property of whichever OpenSSL
      # the runner happens to carry, so the suite's verdict is only readable beside it.
      - name: Record the OpenSSL being linked
        run: |
          pkg-config --modversion libcrypto
          openssl version -a
      - uses: leanprover/lean-action@v1
